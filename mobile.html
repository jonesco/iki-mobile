<title>IBM Network Intelligence — Mobile</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Declares the page as dark so iOS Safari shows the dark keyboard (and dark
     form controls / scrollbars) to match, instead of the default light ones. -->
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#161616; --layer-01:#262626; --layer-02:#393939; --layer-03:#525252;
    --layer-hover:#333333; --layer-hover-02:#474747;
    --field:#262626; --border-subtle:#393939; --border-strong:#6f6f6f;
    --text-primary:#f4f4f4; --text-secondary:#c6c6c6; --text-placeholder:#6f6f6f; --text-helper:#8d8d8d;
    --interactive:#4589ff; --link:#78a9ff; --btn-primary:#0f62fe; --btn-primary-hover:#0353e9; --btn-secondary:#6f6f6f; --btn-secondary-hover:#606060;
    --focus:#ffffff;
    --sup-error:#fa4d56; --sup-warning:#f1c21b; --sup-success:#42be65; --sup-info:#4589ff;
    --tag-gray-bg:#525252; --tag-gray-fg:#e0e0e0;
    --chart-2:#33b1ff; --chart-4:#ff7eb6; --chart-5:#fa4d56;
    --magenta:#d02670; --purple:#8a3ffc;
    --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text-primary);font:14px/1.43 var(--sans);letter-spacing:.16px;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
  button{font:inherit;letter-spacing:inherit;cursor:pointer;color:inherit}
  button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
  ::-webkit-scrollbar{display:none}
  .icon{width:16px;height:16px;fill:currentColor;flex:none}
  .mono{font-family:var(--mono)}
  .tag{display:inline-flex;align-items:center;height:20px;padding:0 8px;font-size:12px;line-height:16px;letter-spacing:.32px;border-radius:12px;white-space:nowrap}
  .tag-gray{background:var(--tag-gray-bg);color:var(--tag-gray-fg)}
  .btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;height:44px;padding:0 16px;border:1px solid transparent;font-size:14px;line-height:18px;white-space:nowrap}
  .btn svg{width:16px;height:16px;fill:currentColor}
  .btn-primary{background:var(--btn-primary);color:#fff}
  .btn-secondary{background:var(--btn-secondary);color:#fff}

  /* ---------- app shell ---------- */
  .ibm-hdr{flex:none;height:44px;background:var(--bg);border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;padding:0 16px;gap:8px}
  .ibm-hdr .icon{width:16px;height:16px;fill:currentColor;flex:none}
  .ibm-hdr .brand{font-weight:400;font-size:14px;letter-spacing:.16px}
  .ibm-hdr .brand b{font-weight:600;margin-right:6px}
  .ibm-hdr .spacer{flex:1}
  .ibm-hdr .avatar{width:28px;height:28px;border-radius:50%;background:var(--layer-02);display:grid;place-items:center;font-size:11px;letter-spacing:.32px;flex:none}
  .topbar{flex:none;min-height:52px;background:var(--bg);border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;gap:4px;padding:0 4px}
  .topbar.root{padding:0 16px}
  .topbar .backbtn{width:44px;height:44px;border:0;background:transparent;color:var(--text-primary);display:inline-flex;align-items:center;justify-content:center;flex:none}
  .topbar .backbtn:active{background:var(--layer-hover)}
  .topbar .ttl{font-size:15px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .topbar.root .ttl{font-size:22px;font-weight:400}
  #screen{flex:1;overflow-y:auto;min-height:0;padding-bottom:24px}
  /* Once an investigation's own chat has started, #screen stops being
     the scroll container itself — the reference (top) and chat (bottom)
     halves each scroll on their own instead. */
  #screen.is-split{overflow:hidden;padding-bottom:0;display:flex;flex-direction:column}
  /* Grid rows (1fr 1fr), not flex-basis percentages — guarantees an
     exact even split regardless of how much either side's content
     needs; each half scrolls its own overflow instead of growing. */
  /* Top's height is a live inline style (flex-basis %, set from
     chat.splitPct and updated during drag) — flex, not grid, so the
     grabber can sit as its own fixed-height row between the two panes
     and the bottom pane just absorbs whatever's left. */
  .detail-split{display:flex;flex-direction:column;height:100%;min-height:0}
  .detail-split-top{min-height:0;overflow-y:auto}
  /* Grabber + chat half read as one raised sheet: same surface, no seam
     between them, and a shadow up along the top edge to lift it off the
     page background behind the reference half. */
  .split-grabber{flex:none;height:22px;display:flex;align-items:center;justify-content:center;cursor:ns-resize;touch-action:none;background:var(--layer-01);border-top:1px solid var(--border-subtle);border-radius:16px 16px 0 0;position:relative;z-index:1;box-shadow:0 -10px 24px rgba(0,0,0,.55)}
  .split-grabber::after{content:'';width:36px;height:4px;border-radius:2px;background:var(--border-strong)}
  .detail-split-bottom{flex:1 1 auto;min-height:0;overflow-y:auto;background:var(--layer-01)}
  .chat-half-hd{display:flex;align-items:center;justify-content:space-between;padding:12px 8px 8px 16px}
  .chat-half-hd span{font-size:12px;font-weight:600;letter-spacing:.32px;text-transform:uppercase;color:var(--text-helper)}
  .chat-half-close{width:28px;height:28px;padding:0;background:transparent;border:0;color:var(--text-helper);display:grid;place-items:center;flex:none}
  .chat-half-close:active{background:var(--layer-hover);color:var(--text-primary)}
  .chat-half-close .icon{width:14px;height:14px}
  /* Composer: an inset rounded box floating above the safe area (like the
     Claude app), not a flat strip flush with the screen edge. 16px text
     also stops iOS Safari from auto-zooming the page when it's focused. */
  .inputbar{flex:none;padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:var(--layer-01);border-top:1px solid var(--border-subtle)}
  /* Keyboard up (textarea focused): the keyboard covers the home-indicator
     area, so the safe-area padding would just be dead space under the box. */
  .inputbar:focus-within{padding-bottom:12px}
  .inputbar .box{background:var(--layer-01);border:1px solid var(--border-strong);border-radius:24px;display:flex;align-items:flex-end;padding:6px 6px 6px 8px;min-height:56px}
  .inputbar .box:focus-within{border-color:var(--text-secondary)}
  .inputbar textarea{flex:1;background:transparent;border:0;color:var(--text-primary);font:16px/22px var(--sans);padding:10px 8px 10px 10px;resize:none;min-height:42px;max-height:132px;outline:none}
  .inputbar textarea::placeholder{color:var(--text-placeholder)}
  .inputbar button{width:42px;height:42px;border-radius:50%;background:var(--interactive);border:0;color:#000;display:grid;place-items:center;flex:none;margin:0}
  .inputbar button:active{background:var(--btn-primary-hover);color:#fff}
  .inputbar button .icon{width:18px;height:18px}
  .tabbar{flex:none;display:flex;overflow:hidden;margin:0 16px calc(12px + env(safe-area-inset-bottom));border:1px solid var(--border-subtle);border-radius:999px;background:var(--layer-01);box-shadow:0 4px 16px rgba(0,0,0,.4)}
  .tabbar[hidden]{display:none}
  .tabbar button{flex:1;display:flex;align-items:center;justify-content:center;padding:15px 4px;background:transparent;border:0;color:var(--text-helper)}
  .tabbar button .icon{width:22px;height:22px}
  .tabbar button.on{color:var(--text-primary)}

  /* ---------- lists ---------- */
  .sechd{padding:16px 16px 8px;font-size:12px;font-weight:600;letter-spacing:.32px;text-transform:uppercase;color:var(--text-helper)}
  .rail-empty{padding:24px 16px;color:var(--text-helper);font-size:13px;text-align:center}
  .list{display:flex;flex-direction:column}
  .lrow{display:block;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--border-subtle);padding:14px 16px}
  .lrow:active{background:var(--layer-hover)}
  .lrow .title{font-size:15px;font-weight:600;margin-bottom:4px;line-height:1.35}
  .lrow .meta{font-size:12px;color:var(--text-secondary);margin-bottom:8px}
  .need{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-secondary)}
  .need-badge{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;color:#000}
  .need-badge .icon{width:11px;height:11px}
  .need-badge.tool{background:var(--sup-warning)} .need-badge.rem{background:var(--sup-warning)} .need-badge.input{background:var(--magenta);color:#fff} .need-badge.recommend{background:var(--purple)} .need-badge.closed{background:var(--text-helper)} .need-badge.watch{background:var(--text-helper)} .need-badge.reanalyzing{background:transparent;color:var(--interactive)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .icon.spin{animation:spin 1s linear infinite;transform-origin:50% 50%}
  .filter-seg{display:flex;flex-wrap:wrap;gap:6px;padding:12px 16px}
  .filter-seg button{height:30px;padding:0 12px;font-size:12px;letter-spacing:.16px;background:transparent;border:1px solid var(--border-subtle);color:var(--text-secondary);border-radius:15px}
  .filter-seg button.on{background:#fff;color:#000;border-color:#fff}
  .rowbtn{display:flex;align-items:center;gap:10px;width:100%;background:var(--layer-01);border:0;border-bottom:1px solid var(--border-subtle);padding:15px 16px;color:var(--text-primary);font-size:14px;text-align:left}
  .rowbtn:active{background:var(--layer-hover)}
  .rowbtn .lead{color:var(--text-helper)}
  .rowbtn .t{flex:1;font-weight:600}
  .rowbtn .chev{color:var(--text-helper)}

  /* ---------- brief / status ---------- */
  .brief{border-bottom:8px solid var(--layer-01)}
  /* No background of its own — same treatment .appr already gets inside
     the feed: its own border+layer-01 fill reads as a floating card
     against the screen's dark background, which is what actually
     separates it from .brief above (a shared background would just
     make the two blend together). */
  .next-step-card{padding:16px}
  .next-step-card .brief-sec-hd{margin-bottom:8px}
  .status-band{padding:16px;border-left:3px solid var(--border-strong);background:var(--layer-01)}
  .status-band .status-label{display:flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.32px;text-transform:uppercase;color:var(--text-helper);margin-bottom:6px}
  .status-band .status-label .icon{width:14px;height:14px}
  .status-band .status-headline{font-size:17px;font-weight:600;line-height:1.35}
  .status-band.tool{border-left-color:var(--sup-warning)} .status-band.rem{border-left-color:var(--sup-warning)}
  .status-band.input{border-left-color:var(--magenta)} .status-band.recommend{border-left-color:var(--purple)}
  .status-band.closed{border-left-color:var(--text-helper)} .status-band.watch{border-left-color:var(--text-helper)}
  .status-band.reanalyzing{border-left-color:var(--interactive)} .status-band.none{border-left-color:var(--text-helper)}
  .facts{display:grid;grid-template-columns:1fr 1fr;background:var(--layer-01);border-top:1px solid var(--border-subtle)}
  .fact{padding:12px 16px;border-right:1px solid var(--border-subtle);border-bottom:1px solid var(--border-subtle)}
  .fact:nth-child(2n){border-right:0}
  .fact .v{font-size:19px;line-height:26px;font-variant-numeric:tabular-nums}
  .fact .v.bad{color:var(--sup-error)} .fact .v.warn{color:var(--sup-warning)} .fact .v.ok{color:var(--sup-success)}
  .fact .l{font-size:11px;color:var(--text-helper);letter-spacing:.32px}
  .brief-section{padding:16px;background:var(--layer-01);border-top:1px solid var(--border-subtle)}
  .brief-sec-hd{font-size:12px;font-weight:600;letter-spacing:.32px;text-transform:uppercase;color:var(--text-helper);margin-bottom:6px}
  .brief-section p{margin:0;color:var(--text-secondary)}
  .indicators{margin:0;padding-left:18px;color:var(--text-secondary)}
  .indicators li{margin:5px 0}

  /* ---------- feed / approval cards ---------- */
  .feed{padding:16px;display:flex;flex-direction:column;gap:14px}
  .msg.assist .content p{margin:0 0 8px} .msg.assist .content p:last-child{margin-bottom:0}
  .msg.assist .content ul{margin:4px 0 8px;padding-left:18px} .msg.assist .content li{margin:2px 0}
  .msg.assist .content .k{color:var(--text-secondary)}
  .msg.user{display:flex;justify-content:flex-end}
  .msg.user .bubble{max-width:84%;background:#fff;color:#161616;padding:10px 16px;border-radius:20px}
  .msg.user .bubble p{margin:0}
  .inline-link{background:none;border:0;padding:0;margin:0;font:inherit;color:var(--link);cursor:pointer;text-decoration:underline}
  .appr{border:1px solid var(--border-subtle);background:var(--layer-01)}
  .appr .hd{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border-subtle)}
  .appr .hd .icon{color:var(--link)} .appr.rem .hd .icon{color:var(--sup-warning)} .appr.question .hd .icon{color:var(--text-secondary)} .appr.recommend .hd .icon{color:var(--purple)} .appr.info .hd .icon{color:var(--text-helper)}
  .appr .hd .t{font-weight:600;flex:1;font-size:13px}
  .appr .bd{padding:12px 14px;display:grid;gap:10px}
  .appr .row{display:grid;grid-template-columns:1fr;gap:2px;font-size:13px}
  .appr .row .k{color:var(--text-helper);font-size:11px;letter-spacing:.32px}
  code,.cmd{font-family:var(--mono);font-size:12.5px;background:var(--bg);border:1px solid var(--border-subtle);padding:2px 6px}
  .cmd{display:block;padding:8px 10px;white-space:pre-wrap;word-break:break-word;line-height:1.5}
  .appr .ft-input{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--border-subtle)}
  .appr .ft-input .qinput{flex:1;height:40px;background:var(--field);border:0;border-bottom:1px solid var(--border-strong);color:var(--text-primary);padding:0 8px;font:14px var(--sans)}
  .appr .ft{display:flex;flex-direction:column;border-top:1px solid var(--border-subtle)}
  .appr .ft .btn{justify-content:center;height:48px}
  .appr .decided{padding:12px 14px;border-top:1px solid var(--border-subtle);display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-secondary)}
  .appr .decided .icon{color:var(--sup-success)} .appr .decided.no .icon{color:var(--sup-error)}
  .tool-out{border:1px solid var(--border-subtle);background:var(--bg)}
  .tool-out .hd{display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:12px;color:var(--text-secondary);border-bottom:1px solid var(--border-subtle);font-family:var(--mono)}
  .tool-out pre{margin:0;padding:10px;font:11.5px/1.55 var(--mono);color:var(--text-secondary);overflow-x:auto;white-space:pre}
  .tool-out pre .hl{color:var(--sup-warning)} .tool-out pre .bad{color:var(--sup-error)} .tool-out pre .ok{color:var(--sup-success)}
  .typing{display:inline-flex;gap:4px;padding:8px 0}.typing i{width:6px;height:6px;border-radius:50%;background:var(--text-helper);animation:blink 1s infinite}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
  .reanalyzing-row{display:flex;align-items:center;gap:8px;padding:4px 0;color:var(--interactive);font-size:13px}
  .reanalyzing-row .icon{width:15px;height:15px}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

  /* ---------- observations / kv / chart ---------- */
  .embed{border:1px solid var(--border-subtle);background:var(--layer-01)}
  .embed .hd{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border-subtle)}
  .embed .hd .t{font-weight:600;flex:1;font-size:13px}
  .embed .bd{padding:12px}
  .chart{width:100%;height:auto;display:block}
  .chart text{font-family:var(--mono);font-size:10px;fill:var(--text-helper)}
  .chart .grid{stroke:var(--border-subtle);stroke-width:1}
  .chart .axis{stroke:var(--border-strong)}
  .chart .thr{stroke:var(--sup-error);stroke-dasharray:3 3;stroke-width:1}
  .chart .end{font-weight:500;fill:var(--text-primary)}
  .chart-cap{display:flex;justify-content:space-between;font-size:12px;color:var(--text-helper);margin-top:6px;font-variant-numeric:tabular-nums}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin:0}
  .kv dt{color:var(--text-helper);font-size:12px;letter-spacing:.32px;padding-top:1px;white-space:nowrap} .kv dd{margin:0;font-family:var(--mono);font-size:12px;overflow-wrap:anywhere}
  .kv dd.bad{color:var(--sup-error)} .kv dd.warn{color:var(--sup-warning)} .kv dd.ok{color:var(--sup-success)}

  /* ---------- accordion Q&A ---------- */
  .acc-list{border-top:1px solid var(--border-subtle)}
  .acc{border-bottom:1px solid var(--border-subtle)}
  .acc-q{display:flex;align-items:center;gap:8px;width:100%;background:transparent;border:0;padding:13px 16px;color:var(--link);font-size:13px;text-align:left}
  .acc-q:active{background:var(--layer-hover)}

  /* ---------- topology ---------- */
  .topo{padding:16px}
  .topo svg{width:100%;height:auto;display:block;overflow:visible}
  .topo-label{fill:var(--text-primary);font:600 12px var(--sans)}
  .topo-sub{fill:var(--text-helper);font:11px var(--sans)}
  .topo-tag{fill:var(--text-helper);font:10px var(--mono);letter-spacing:.3px}
  .topo-site{fill:none;stroke:var(--border-subtle);stroke-dasharray:3 3}
  .topo-site-label{fill:var(--text-helper);font:600 10px var(--sans);letter-spacing:.48px;text-transform:uppercase}

  /* ---------- autonomous activity ---------- */
  .act-toprow{padding:12px 16px 0}
  /* Custom, not a native <select> — the native popup is OS/browser
     chrome, not page content, so in Chrome's device emulation it renders
     relative to the real window instead of the simulated phone (and on
     a real phone it'd still be an unthemed native picker, out of place
     next to everything else here being custom-styled). */
  .act-period-wrap{position:relative}
  .act-period-btn{width:100%;display:flex;align-items:center;justify-content:space-between;background:var(--layer-01);border:1px solid var(--border-subtle);color:var(--text-primary);font:14px var(--sans);height:40px;padding:0 10px}
  .act-period-btn .icon{width:14px;height:14px;color:var(--text-helper)}
  .act-period-menu{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:20;background:var(--layer-02);border:1px solid var(--border-subtle);box-shadow:0 4px 16px rgba(0,0,0,.4)}
  .act-period-menu[hidden]{display:none}
  .act-period-opt{display:block;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--border-subtle);padding:11px 12px;color:var(--text-primary);font:14px var(--sans)}
  .act-period-opt:last-child{border-bottom:0}
  .act-period-opt:active{background:var(--layer-hover)}
  .act-period-opt.on{color:var(--interactive);font-weight:600}
  .act-card{border:1px solid var(--border-subtle);background:var(--layer-01);padding:16px;margin:12px 16px}
  .act-card-hd{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px}
  .act-title{font-size:12px;font-weight:600;letter-spacing:.32px;text-transform:uppercase;color:var(--text-helper)}
  .act-toggle{display:flex;gap:8px;margin-left:auto}
  .act-toggle button{height:30px;padding:0 10px;background:transparent;border:1px solid var(--border-subtle);color:var(--text-secondary);font-size:12px}
  .act-toggle button.on{background:var(--layer-02);color:var(--text-primary);border-color:var(--layer-02)}
  .act-big{font-size:20px;font-variant-numeric:tabular-nums;font-weight:600;background:var(--sup-success);color:#06210e;min-width:20px;text-align:center;line-height:32px;padding:0 12px}
  .act-big.dismissed{background:var(--sup-error);color:#fff}
  .act-stages{list-style:none;margin:0;padding:0;display:grid;gap:1px;background:var(--border-subtle);border:1px solid var(--border-subtle)}
  .act-stages button{display:flex;align-items:center;gap:10px;width:100%;background:var(--bg);border:0;padding:12px;color:var(--text-placeholder);text-align:left}
  .act-stages button.has-v{color:var(--text-primary)}
  .act-stages .act-stage-icon{width:16px;height:16px;display:grid;place-items:center;flex:none}
  .act-stages .act-stage-icon .icon{width:14px;height:14px}
  .act-stages .act-stage-label{flex:1;font-size:13px}
  .act-stages .act-stage-v{font-size:16px;font-variant-numeric:tabular-nums;color:var(--text-secondary);flex:none}
  .act-stages button.has-v .act-stage-v{color:var(--text-primary);font-weight:600}
  .act-rows{display:flex;flex-direction:column}
  .act-row{display:flex;align-items:baseline;justify-content:space-between;width:100%;background:transparent;border:0;border-top:1px solid var(--border-subtle);padding:12px 4px;color:inherit;text-align:left}
  .act-row:first-child{border-top:0}
  .act-row-label{font-size:13px;color:var(--text-secondary)}
  .act-row-right{text-align:right;display:flex;flex-direction:column;gap:2px}
  .act-row-pct{font-size:12px;color:var(--text-helper)} .act-row-pct.good{color:var(--sup-success)}
  .act-row-v{font-size:18px;font-variant-numeric:tabular-nums;color:var(--text-primary)}
  .act-row-v.mono{font-family:var(--mono);font-size:15px}
  .act-donut-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .act-donut-box{position:relative;width:88px;height:88px;flex:none}

/* =======================================================================
   Charts (verbatim from desktop) + observation card body
   ======================================================================= */
function chartSVG(c){
  const W=320,H=132,L=34,R=10,T=10,B=20;
  const s=c.series, n=s.length;
  let lo=Math.min(...s), hi=Math.max(...s);
  if(c.thr!=null){lo=Math.min(lo,c.thr);hi=Math.max(hi,c.thr);}
  if(c.ymax!=null){hi=c.ymax;lo=0;}
  if(hi===lo){hi=lo+1;}
  const pad=(hi-lo)*0.12; if(c.ymax==null){hi+=pad; lo-=pad;}
  if(c.unit==='%'&&lo<0) lo=0; if(c.unit==='/min'&&lo<0) lo=0;
  const x=(i)=>L+(i/(n-1))*(W-L-R), y=(v)=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  const fmt=(v)=>c.labels?c.labels[Math.round(v)]:(Math.abs(v)>=100?v.toFixed(0):Math.abs(v)>=10?v.toFixed(0):v.toFixed(1));
  const ticks=c.ymax!=null?[0,1]:[lo,(lo+hi)/2,hi];
  let g='';
  ticks.forEach(t=>{g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}"/><text x="${L-4}" y="${(y(t)+3).toFixed(1)}" text-anchor="end">${fmt(t)}</text>`;});
  const pts=s.map((v,i)=>[x(i),y(v)]);
  let d='';
  if(c.kind==='step'){ pts.forEach((p,i)=>{ d+= i===0?`M${p[0].toFixed(1)},${p[1].toFixed(1)}`:`H${p[0].toFixed(1)}V${p[1].toFixed(1)}`; }); }
  else { d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(''); }
  const color=c.kind==='step'?'var(--chart-2)':(c.thr!=null&&s[n-1]>c.thr&&c.unit!==' dBm')||(c.unit===' dBm'&&s[n-1]<c.thr)?'var(--chart-5)':'var(--chart-2)';
  let area='';
  if(c.kind==='area'){ area=`<path d="${d}V${y(lo).toFixed(1)}H${x(0).toFixed(1)}Z" fill="${color}" opacity=".14"/>`; }
  let thr='';
  if(c.thr!=null){ thr=`<line class="thr" x1="${L}" x2="${W-R}" y1="${y(c.thr).toFixed(1)}" y2="${y(c.thr).toFixed(1)}"/>`; }
  const last=pts[n-1];
  const endLbl=`${fmt(s[n-1])}${c.unit||''}`;
  const lx=last[0]-4, ly=last[1]<T+16?last[1]+14:last[1]-7;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.title)}">
    ${g}<line class="axis" x1="${L}" x2="${W-R}" y1="${(H-B).toFixed(1)}" y2="${(H-B).toFixed(1)}"/>
    ${area}${thr}<path d="${d}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3" fill="${color}"/>
    <text class="end" x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="end">${endLbl}</text>
    <text x="${L}" y="${H-6}">-60 min</text><text x="${W-R}" y="${H-6}" text-anchor="end">now</text>
  </svg>`;
}

function needFor(i){
  if(i.passive) return {cls:'none',icon:'',t:i.stage};
  const st=state.invStatus[i.id];
  if(st.reanalyzing) return {cls:'reanalyzing',icon:ICON.spinner,t:'Reanalyzing…'};
  if(st.closed) return {cls:'closed',icon:ICON.check,t:i.isRec?'Applied':'Closed'};
  const step=i.steps[st.stepIdx];
  if(!step) return {cls:'closed',icon:ICON.check,t:i.isRec?'Applied':'Closed'};
  if(st.waiting) return {cls:'watch',icon:ICON.eye,t:'Running…'};
  // Anything past the very first step only got here by reanalyzing
  // through it, and reanalyzing doesn't auto-hand the human a fresh
  // thing to approve — it settles into a plain "looked at it, nothing
  // needed from you" watch state instead, regardless of what type the
  // next queued step actually is. Only the original first step (the one
  // the investigation opened on) shows as needing approval this way.
  if(st.stepIdx>0) return {cls:'reanalyzing',icon:ICON.spinner,t:'Reanalyzed'};
  if(step.type==='tool') return {cls:'tool',icon:ICON.pause,t:'Needs tool approval'};
  if(step.type==='remediation') return {cls:'rem',icon:ICON.pause,t:'Remediation ready to apply'};
  if(step.type==='question') return {cls:'input',icon:ICON.ask,t:'Needs your input'};
  if(step.type==='info') return {cls:'watch',icon:ICON.eye,t:'For awareness'};
  return {cls:'recommend',icon:ICON.loop,t:i.isRec?'Recommendation':'Apply change'};
}

  // settled) so the re-rendered one can continue from the same place
  // instead of jumping — render() rebuilds the whole screen on every
  // message, which would otherwise kill any open/close animation.
  const oldTop=document.querySelector('.detail-split-top');
  const fromPct=oldTop?splitCurrentPct(oldTop):null;
  $('screen').innerHTML=screenHTML(top);
  const newTop=document.querySelector('.detail-split-top');
  if(newTop) animateSplitTo(newTop, fromPct==null?100:fromPct, +newTop.dataset.pct);
  // Brief, Topology, and Observations all split top/bottom once that
  // investigation's chat has actually started (see wrapChatSplit) —
  // #screen itself has to stop being the scroll container at that
  // point so the two halves can scroll independently instead of
  // fighting it.
  const CHAT_SCREENS=['detail','topology','observations'];
  const chatStarted = CHAT_SCREENS.includes(top.screen) && state.chats[top.id] && state.chats[top.id].started;
  $('screen').classList.toggle('is-split', !!chatStarted);
  const ib=$('inputbar');
  ib.hidden = !(top.screen==='reasoning' || top.screen==='conv' || CHAT_SCREENS.includes(top.screen));
  const msgInput=$('msgInput');
  if(msgInput) msgInput.placeholder = (top.screen==='reasoning' || CHAT_SCREENS.includes(top.screen)) ? 'Ask about this investigation…' : 'Ask a question…';
}

function topbarHTML(top){
  if(top.screen==='root'){
    const label={inv:'Investigations',rec:'Recommendations',activity:'Autonomous activity',chats:'Chats'}[top.tab];
    return `<span class="ttl">${label}</span>`;
  }
  const back=`<button class="backbtn" data-back="1" aria-label="Back"><svg class="icon" viewBox="0 0 16 16"><path d="M6.5 3L8 4.5 4.5 8 8 11.5 6.5 13 1.5 8z"/></svg></button>`;
  if(top.screen==='detail'){ const i=inv(top.id); return back+`<span class="ttl">${esc(i.title)}</span>`; }
  if(top.screen==='topology') return back+`<span class="ttl">Topology</span>`;
  if(top.screen==='observations') return back+`<span class="ttl">Observations</span>`;
  if(top.screen==='reasoning') return back+`<span class="ttl">Reasoning thread</span>`;
  if(top.screen==='conv') return back+`<span class="ttl">Chat</span>`;
  return back;
}

function screenHTML(top){
  if(top.screen==='root') return renderRoot(top.tab);
  if(top.screen==='detail') return renderDetail(top.id);
  if(top.screen==='reasoning') return renderReasoningScreen(top.id);
  if(top.screen==='topology') return renderTopologyScreen(top.id);
  if(top.screen==='observations') return renderObservationsScreen(top.id);
  if(top.screen==='conv') return renderConvScreen(top.convId);
  return '';
}

/* ---- root tabs ---- */

  if(tab==='inv') return renderInvRoot();
  if(tab==='rec') return renderRecRoot();
  if(tab==='activity') return renderActivityRoot();
  return renderChatsRoot();
}
function invRowHTML(i){

  // so that one case overrides it. Recommendations (i.isRec) aren't
  // staged investigations, so they fall back to need.t (already just

  const label=need.cls==='closed'?(i.isRec?'Applied':'Resolved'):(i.stage||need.t);

function actRow(label,pct,val,q,good){

function renderChatsRoot(){
  // Entries with invId point at an investigation's own reasoning thread
  // (started from its brief screen's anchored composer, or a Topology/
  // Observations conversation starter) rather than a free-standing
  // conv — same thread either way, just opened via data-viewreason so
  // it lands back on that investigation's full reasoning screen.
  const rows=state.convs.length?[...state.convs].reverse().map(c=>c.invId
    ? `<button class="lrow" data-viewreason="${c.invId}"><div class="title">${esc(c.title)}</div><div class="meta">${esc(c.when||'now')}</div></button>`
    : `<button class="lrow" data-conv="${c.id}"><div class="title">${esc(c.title)}</div><div class="meta">${esc(c.when||'now')}</div></button>`
  ).join(''):'<div class="rail-empty">Nothing yet.</div>';
  return `<button class="rowbtn" data-newchat="1"><span class="lead"><svg class="icon" viewBox="0 0 16 16"><path d="M8.5 7.5V3h-1v4.5H3v1h4.5V13h1V8.5H13v-1z"/></svg></span><span class="t">New chat</span></button>
  <div class="sechd">Past conversations</div>

}

/* ---- detail screen ---- */
function ensureChat(id){
  if(!state.chats[id]){
    const i=inv(id), chat={messages:[], decisions:{}, started:false, splitHidden:false, splitPct:50};
    // The thread's own opening entry — so "View full reasoning thread"
    // actually shows the whole history (when this was first analyzed
    // and onward), not just the steps from the first approval on.
    chat.messages.push({role:'assist', html:`<p><span class="k">Initially analyzed —</span> ${esc(i.summary)}</p>`});
    if(i.steps[0]) chat.messages.push({kind:'approval', stepIdx:0});
    state.chats[id]=chat;
  }
  return state.chats[id];
}
// Flips a chat from "just the structured approval trail" to "someone's
// actually chatting about this" — the trigger for the brief screen's
// split view, and for surfacing this thread under the Chats tab (a
// pointer at state.chats[id], not a copy — the two stay the same thread).
function markChatStarted(id){
  const chat=ensureChat(id);
  if(!chat.started){
    chat.started=true;
    state.convs.push({id:'invconv-'+id, invId:id, title:inv(id).title, when:'now'});
  }
  return chat;
}
function renderDetail(id){
  const i=inv(id), need=needFor(i), chat=ensureChat(id);
  const st=state.invStatus[id], step=i.steps[st.stepIdx];
  const factsHTML=`<div class="facts">${i.facts.map(f=>`<div class="fact"><div class="v ${f.k||''}">${esc(f.v)}</div><div class="l">${esc(f.l)}</div></div>`).join('')}</div>`;
  // The current pending step surfaces here too, not just inside the full
  // reasoning thread — someone opening an investigation shouldn't have to
  // drill in one more level just to see (and act on) what's next. It's
  // its own trailing card (own border-bottom gutter, like .brief has),
  // not stitched into the middle of the reference card's own flow.
  // st.stepIdx already advances the instant reanalyzing starts (so the
  // chat feed's own "Reanalyzing…" message and this card are describing
  // the same moment) — this has to check st.reanalyzing too, or it shows
  // the next approval card immediately while the thread right below it
  // is still visibly reanalyzing, which is worse than either alone.
  // Matches needFor: only the investigation's original first step ever
  // shows here as something to act on. Anything reached by reanalyzing
  // (st.stepIdx>0) doesn't get handed over as a fresh approval card —
  // this card just disappears once reanalyzed, same as the status does.
  const nextStepHTML = st.reanalyzing
    ? `<div class="next-step-card"><div class="brief-sec-hd">Next step</div><div class="reanalyzing-row">${ICON.spinner}<span>Reanalyzing…</span></div></div>`
    : (step && !st.closed && st.stepIdx===0)
      ? `<div class="next-step-card"><div class="brief-sec-hd">Next step</div>${approvalHTML(i, st.stepIdx, chat)}</div>`
      : '';
  const briefHTML = `<div class="brief">
    <div class="status-band ${need.cls}"><div class="status-label">${needBadge(need)}${esc(need.t)}</div><div class="status-headline">${esc(i.headline)}</div></div>
    ${factsHTML}
    <button class="rowbtn" data-viewtopo="${i.id}"><span class="lead"><svg class="icon" viewBox="0 0 16 16"><path d="M2 2h5v5H2zm7 0h5v5H9zM2 9h5v5H2zm7 2a2 2 0 104 0 2 2 0 00-4 0z"/></svg></span><span class="t">View topology</span><span class="chev">›</span></button>
    ${i.cards.length?`<button class="rowbtn" data-viewobs="${i.id}"><span class="lead">${ICON.eye}</span><span class="t">Observations (${i.cards.length})</span><span class="chev">›</span></button>`:''}
    <button class="rowbtn" data-viewreason="${i.id}"><span class="lead">${ICON.chat}</span><span class="t">View full reasoning thread</span><span class="chev">›</span></button>
    <div class="brief-section"><div class="brief-sec-hd">Details</div><p>${esc(i.summary)}</p></div>
    <div class="brief-section"><div class="brief-sec-hd">Issue indicators</div><ul class="indicators">${i.indicators.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>
  </div>${nextStepHTML}`;
  return wrapChatSplit(id, i, briefHTML);
}
// ---- Chat sheet animation ----
// The chat "sheet" (grabber + chat half) rises from the bottom by shrinking
// the reference pane's flex-basis; flex-basis transitions smoothly and the
// bottom pane just absorbs the rest, so one property drives the whole move.
const SPLIT_EASE='flex-basis .34s cubic-bezier(.2,0,.38,.9)';
function splitCurrentPct(topEl){
  const c=topEl.parentElement; if(!c) return null;
  const ch=c.getBoundingClientRect().height; if(!ch) return null;
  return topEl.getBoundingClientRect().height/ch*100;
}
function animateSplitTo(topEl, fromPct, toPct){
  if(Math.abs(fromPct-toPct)<0.5){ topEl.style.transition='none'; topEl.style.flex=`0 0 ${toPct}%`; return; }
  topEl.style.transition='none';
  topEl.style.flex=`0 0 ${fromPct}%`;
  void topEl.offsetHeight; // commit the start position before easing
  topEl.style.transition=SPLIT_EASE;
  topEl.style.flex=`0 0 ${toPct}%`;
}
// × on the chat half: slide the sheet away first, then actually collapse the
// split in state (render() would otherwise remove it instantly).
function closeChatSheet(id){
  const chat=ensureChat(id), topEl=document.querySelector('.detail-split-top');
  if(!topEl){ chat.splitHidden=true; return render(); }
  animateSplitTo(topEl, splitCurrentPct(topEl)||chat.splitPct||50, 100);
  chat.closing=true;
  setTimeout(()=>{ chat.closing=false; chat.splitHidden=true; render(); }, 350);
}

// Shared by the brief screen, Topology, and Observations — any screen
// that's "about" one investigation gets the same anchored composer and
// the same split-on-send behavior, all backed by the one chat thread
// for that investigation (state.chats[id]), not a per-screen copy.
// Splits into reference (top) / chat (bottom) only once the anchored
// composer has actually been used on ANY of those screens — and stays
// collapsed back to reference-only if the user closed it with the ×
// (sendReasoning reopens it the next time they actually send something,
// so closing never loses the thread, just the space).
function wrapChatSplit(id, i, topHTML){
  const chat=ensureChat(id);
  if(!chat.started || chat.splitHidden) return topHTML;
  // The chat half is just the chat — approvals and tool output already
  // have their own card on the brief screen (see renderDetail's
  // nextStepHTML), so they're left out here instead of showing twice.
  const feed=chat.messages.filter(m=>!m.kind).map(m=>feedItemHTML(i,m,chat)).join('');
  const pct=chat.splitPct||50;
  return `<div class="detail-split">
    <div class="detail-split-top" data-pct="${pct}" style="flex:0 0 ${pct}%">${topHTML}</div>
    <div class="split-grabber" data-splitgrab="${id}" aria-hidden="true"></div>
    <div class="detail-split-bottom">
      <div class="chat-half-hd">
        <span>Chat about this investigation</span>
        <button class="chat-half-close" type="button" data-closechat="${id}" aria-label="Close chat">${ICON.x}</button>
      </div>
      <div class="feed">${feed}</div>
    </div>
  </div>`;
}
// The reasoning thread — approvals, tool output, and free-form back-and-
// forth for this investigation. Same peer level as Topology and
// Observations (a rowbtn on the brief screen, its own screen with the
// composer live), not embedded inline in the brief anymore.
function renderReasoningScreen(id){
  const i=inv(id), chat=ensureChat(id);
  const feed=chat.messages.map(m=>feedItemHTML(i,m,chat)).join('');
  return `<div class="feed">${feed}</div>`;
}
function feedItemHTML(i, m, chat){
  if(m.kind==='approval') return `<div class="msg assist"><div class="content">${approvalHTML(i, m.stepIdx, chat)}</div></div>`;
  if(m.kind==='toolout') return `<div class="msg assist"><div class="content">${toolOutHTML(i, m.stepIdx)}</div></div>`;
  if(m.role==='typing') return `<div class="msg assist"><div class="content"><div class="typing"><i></i><i></i><i></i></div></div></div>`;
  // Reanalyzing needs to actually be visible in the thread someone's
  // looking at, not just a transient badge in a list they may not be
  // looking at — otherwise a response appears to be followed straight
  // by a fresh approval card with nothing shown in between.
  if(m.role==='reanalyzing') return `<div class="msg assist"><div class="content"><div class="reanalyzing-row">${ICON.spinner}<span>Reanalyzing…</span></div></div></div>`;
  if(m.role==='user') return `<div class="msg user"><div class="bubble"><p>${esc(m.text)}</p></div></div>`;
  return `<div class="msg assist"><div class="content">${m.html}</div></div>`;
}
function approvalHTML(i, idx, chat){
  const s=i.steps[idx], dec=chat.decisions[idx];
  if(s.type==='info'){
    return `<p><span class="k">If you want to act on this —</span> ${esc(s.why)}</p>
    <div class="appr info">
      <div class="hd">${ICON.eye}<span class="t">Optional next step · ${esc(s.title)}</span></div>
      <div class="bd">
        <div class="row"><span class="k">Target</span><span class="mono">${esc(s.target)}</span></div>
        <div class="row"><span class="k">Do it yourself</span><span>${esc(s.manual)}</span></div>
        ${s.cmd?`<div class="row"><span class="k">Reference</span><span><code class="cmd">${esc(s.cmd)}</code></span></div>`:''}
      </div>
    </div>`;
  }
  if(s.type==='question'){
    return `<p><span class="k">Needs your input —</span> ${esc(s.why)}</p>
    <div class="appr question">
      <div class="hd">${ICON.ask}<span class="t">Needs your input · ${esc(s.title)}</span></div>
      <div class="bd"><div class="row"><span class="k">Ask</span><span>${esc(s.prompt)}</span></div></div>
      ${dec?`<div class="decided">${ICON.check}"${esc(dec)}" — answered by you</div>`
        :`<div class="ft-input"><input type="text" id="qinput-${idx}" class="qinput" placeholder="Type your answer…"/><button class="btn btn-primary" style="height:40px" data-answer="${idx}">Send</button></div>`}
    </div>`;
  }
  const isTool=s.type==='tool', isRecommend=s.type==='recommend';
  const icon=isTool?ICON.tool:isRecommend?ICON.loop:ICON.rem;
  const label=isTool?'Tool approval':isRecommend?'Recommendation approval':'Remediation approval';
  const approveLabel=isTool?'Approve & run':isRecommend?'Apply change':'Approve & apply';
  const declineLabel=isRecommend?'Dismiss':'Decline';
  return `<p><span class="k">${isRecommend?'Recommendation —':'Next step —'}</span><br>${esc(s.why)}</p>
  <div class="appr ${isTool?'tool':isRecommend?'recommend':'rem'}">
    <div class="hd">${icon}<span class="t">${label} · ${esc(s.title)}</span></div>
    <div class="bd">
      <div class="row"><span class="k">Target</span><span class="mono">${esc(s.target)}</span></div>
      <div class="row"><span class="k">${isTool?'Commands':'Change'}</span><span><code class="cmd">${esc(s.cmd)}</code></span></div>
      <div class="row"><span class="k">Risk</span><span>${esc(s.risk)}</span></div>
      ${s.side?`<div class="row"><span class="k">Also</span><span>${esc(s.side)}</span></div>`:''}
    </div>
    ${dec?`<div class="decided ${dec==='deny'?'no':''}">${dec==='deny'?ICON.x:ICON.check}${dec==='deny'?(isRecommend?'Dismissed':'Declined'):(isTool?'Approved — ran':'Approved — applied')}</div>`
      :`<div class="ft"><button class="btn btn-primary" data-approve="${idx}">${approveLabel}</button><button class="btn btn-secondary" data-deny="${idx}">${declineLabel}</button></div>`}
  </div>`;
}
function toolOutHTML(i, idx){
  const s=i.steps[idx];
  return `<div class="tool-out"><div class="hd">${ICON.tool}${esc(s.target)} · ${s.type==='tool'?'output':'commit log'}</div><pre>${s.output}</pre></div><p style="margin-top:12px">${esc(s.finding)}</p>`;
}
function decide(id, idx, dec){
  const i=inv(id), st=state.invStatus[id], chat=state.chats[id], step=i.steps[idx];
  chat.decisions[idx]=dec;
  render();
  if(step.type==='recommend'){
    if(dec==='approve'){
      st.closed=true;
      chat.messages.push({role:'assist',html:`<p>Applied. ${esc(step.side||'')}</p>`});
    } else {
      chat.messages.push({role:'assist',html:'<p>Understood — leaving this as a recommendation for now.</p>'});
    }
    render(); scrollBottom(); return;
  }
  if(dec==='deny'){
    chat.messages.push({role:'typing'}); render();
    setTimeout(()=>{
      chat.messages.pop();
      chat.messages.push({role:'assist',html:`<p>Understood — I won't ${step.type==='tool'?'run that':'apply that change'}. Let me know what you'd rather check first.</p>`});
      render(); scrollBottom();
    }, 700); return;
  }
  chat.messages.push({role:'typing'}); render(); scrollBottom();
  setTimeout(()=>{
    chat.messages.pop();
    chat.messages.push({kind:'toolout', stepIdx:idx});
    // Reanalyzing is its own visible beat in the thread — not just a
    // badge that changes somewhere else — so a response is never
    // immediately followed by a fresh approval card with nothing shown
    // in between. Mirrors exactly what happens after a question gets
    // answered (see answerQuestion below).
    st.stepIdx=idx+1; st.reanalyzing=true;
    chat.messages.push({role:'reanalyzing'});
    render(); scrollBottom();
    // Toast fires with the reveal below, not here — it used to fire the
    // moment reanalyzing started but stay up longer (2200ms) than
    // reanalyzing itself lasted, so there was a real stretch where the
    // toast was still visible claiming "just ran" while the next
    // approval card had already appeared. The two should never be
    // telling a different story at the same time.
    setTimeout(()=>{
      chat.messages.pop();
      st.reanalyzing=false;
      // Doesn't hand over a fresh approval card even if there's another
      // step queued — reanalyzing concludes, it doesn't escalate into a
      // new ask on its own (see needFor: anything past the first step
      // reads as "Reanalyzed", not "needs approval").
      chat.messages.push({role:'assist', html:'<p>Reanalyzed — nothing further needed right now.</p>'});
      render(); scrollBottom();
      toast(step.type==='tool'?'Tool ran on '+step.target:'Change applied on '+step.target);
    }, 2200);
  }, 1200);
}
function answerQuestion(id, idx){
  const i=inv(id), st=state.invStatus[id], chat=state.chats[id];
  const el=$('qinput-'+idx); const val=(el.value||'').trim(); if(!val) return;
  chat.decisions[idx]=val;
  render();
  chat.messages.push({role:'typing'}); render(); scrollBottom();
  setTimeout(()=>{
    chat.messages.pop();
    chat.messages.push({role:'assist',html:`<p>Got it — noted: "${esc(val)}".</p>`});
    // Same reanalyzing beat the tool-call flow gets — answering a
    // question isn't the end of the investigation, it's new context
    // the agent has to fold back in, which takes a moment and can
    // surface a new step. It should never just flip straight to
    // "Closed" the instant an answer comes in, or straight to a fresh
    // approval card with no visible sign anything happened in between.
    st.stepIdx=idx+1; st.reanalyzing=true;
    chat.messages.push({role:'reanalyzing'});
    render(); scrollBottom();
    setTimeout(()=>{
      chat.messages.pop();
      st.reanalyzing=false;
      // Same as decide() — doesn't escalate into a fresh approval card
      // on its own even if another step is queued.
      chat.messages.push({role:'assist', html:'<p>Reanalyzed with that context — nothing further needed right now.</p>'});
      render(); scrollBottom();
      toast('Answer recorded');
    }, 2200);
  }, 700);
}
function replyForInv(text, i, st){
  const t=text.toLowerCase(); const step=i.steps[st.stepIdx];
  if(/why|cause|root/.test(t)) return `<p>${esc(i.caseLines[0].h)}. ${esc(i.caseLines[0].s)}</p>`;
  if(/risk|safe|revert|rollback|undo/.test(t)) return step?`<p>The pending step is <b>${esc(step.title)}</b>.${step.risk?' Risk: '+esc(step.risk)+'.':''}</p>`:'<p>Nothing is pending on this investigation right now.</p>';
  if(/impact|customer|who/.test(t)) return `<p>${esc(i.facts.map(f=>f.l+': '+f.v).join(' · '))}</p>`;
  if(/topolog|diagram|show|map/.test(t)) return `<p>Check the <b>View topology</b> row above for a visual of what's involved.</p>`;
  if(/approve|yes|go ahead|do it/.test(t)&&step&&step.type!=='question'&&step.type!=='info'&&!(state.chats[i.id].decisions[st.stepIdx])){ setTimeout(()=>decide(i.id, st.stepIdx,'approve'),200); return `<p>Approving <b>${esc(step.title)}</b> now.</p>`; }
  return `<p>On <b>${esc(i.title)}</b>: ${esc(i.summary.split('. ')[0])}. ${step?`The next thing I need from you is the ${step.type==='tool'?'tool approval':step.type==='question'?'answer':step.type==='recommend'?'recommendation approval':step.type==='info'?'optional step':'remediation approval'} above.`:'Nothing further is pending.'}</p>`;
}
function sendReasoning(id, text){
  text=(text||'').trim(); if(!text) return;
  const i=inv(id), st=state.invStatus[id], chat=markChatStarted(id);
  chat.splitHidden=false; // sending a message always reopens a closed split
  chat.messages.push({role:'user', text});
  $('msgInput').value='';
  render(); scrollBottom();
  chat.messages.push({role:'typing'}); render(); scrollBottom();
  setTimeout(()=>{
    chat.messages.pop();
    chat.messages.push({role:'assist', html: replyForInv(text, i, st)});
    render(); scrollBottom();
  }, 700);
}

// A conversation starter tapped from Topology or Observations drops the
// question + its answer straight into the investigation's reasoning
// thread (state.chats[id], same one `sendReasoning` writes to) and jumps
// there — so it lands as the start of a real back-and-forth (composer
// open, can ask follow-ups) instead of an inline accordion reveal with
// nowhere to go next.
// Same idea as askStarter below, but for the Activity tab's own
// questions — those aren't scoped to one investigation, so this starts
// a plain free-form conversation (state.convs) rather than writing into
// an investigation's reasoning thread. Lands on the same real
// back-and-forth conv screen (composer open, follow-ups work, and it
// shows up under Chats afterward) instead of an inline accordion reveal.
function askActivityStarter(topic){
  const q=actQuestionText(topic), a=actAnswerHTML(topic);
  if(!q) return;
  const conv={id:'cv-'+Date.now(), title:q.length>42?q.slice(0,40)+'…':q, when:'now', messages:[{role:'user',text:q},{role:'typing'}]};
  state.convs.push(conv);
  push({screen:'conv', convId:conv.id});
  scrollBottom();
  setTimeout(()=>{
    conv.messages.pop();
    conv.messages.push({role:'assist', html:a});
    render(); scrollBottom();
  }, 700);
}
function askStarter(id, q, a){
  const chat=markChatStarted(id);
  chat.messages.push({role:'user', text:q});
  chat.messages.push({role:'typing'});
  // Stays on whatever screen the starter was tapped from (Topology or
  // Observations) and lets it split top/bottom — same as typing into
  // the anchored composer there would. It used to jump straight to the
  // full reasoning screen, which was a different, inconsistent pattern
  // from the one everything else here now follows.
  render();
  scrollBottom();
  setTimeout(()=>{
    chat.messages.pop();
    chat.messages.push({role:'assist', html:a});
    render(); scrollBottom();
  }, 700);
}

/* ---- topology & observations screens ---- */
function starterListHTML(qs, keyPrefix){
  return `<div class="acc-list">${qs.map((qq,k)=>`<div class="acc"><button class="acc-q" data-starter="${keyPrefix}:${k}">${esc(qq.q)}</button></div>`).join('')}</div>`;
}
function renderTopologyScreen(id){
  const i=inv(id), qs=topoQuestionsFor(i);
  const topHTML = `${topologyHTML(i)}
  <div class="sechd">Ask about this</div>
  ${starterListHTML(qs, 'topo:'+id)}`;
  return wrapChatSplit(id, i, topHTML);
}
function renderObservationsScreen(id){
  const i=inv(id);
  const topHTML = i.cards.map(c=>{
    const qs=questionsFor(c);
    return `<div class="embed" style="margin:12px 16px"><div class="hd">${c.type==='chart'?ICON.chart:ICON.eye}<span class="t">${esc(c.title)}</span></div>
      <div class="bd">${cardBody(c)}</div>
      ${starterListHTML(qs, 'obs:'+id+':'+c.id)}
    </div>`;
  }).join('');
  return wrapChatSplit(id, i, topHTML);
}

/* ---- free-form chat screen ---- */
function startNewChat(){ state.draftConv={id:null, title:'', when:'now', messages:[]}; push({screen:'conv', convId:'draft'}); }
function getConv(convId){ return convId==='draft'?state.draftConv:state.convs.find(c=>c.id===convId); }
function renderConvScreen(convId){
  const conv=getConv(convId);
  const feed=conv.messages.map(m=>{
    if(m.role==='typing') return `<div class="msg assist"><div class="content"><div class="typing"><i></i><i></i><i></i></div></div></div>`;
    if(m.role==='user') return `<div class="msg user"><div class="bubble"><p>${esc(m.text)}</p></div></div>`;
    return `<div class="msg assist"><div class="content">${m.html}</div></div>`;
  }).join('');
  return `<div class="feed">${feed||'<div class="rail-empty">Ask a question to start.</div>'}</div>`;
}
// Matches free-typed text against one of the Activity tab's suggested
// questions, phrased for whichever period is currently selected there —
// so typing the exact suggested question in general chat still answers
// with the same (period-correct) numbers as tapping it would.
function activityAnswerForText(text){
  const allTopics=[].concat(ACT_STAGE_META.valid.map(s=>s.key), ACT_STAGE_META.dismissed.map(s=>s.key), Object.keys(ACT_THROUGHPUT_Q));
  const topic=allTopics.find(k=>actQuestionText(k)===text);
  return topic?actAnswerHTML(topic):null;
}
function replyGeneric(text){
  const actAns=activityAnswerForText(text);
  if(actAns) return actAns;
  const t=text.toLowerCase();
  if(/headroom|transit|uplink/.test(t)) return `<p>Least transit headroom right now:</p><ul><li><b>dfw2</b> core-sw-01 Po12 — 96%</li><li><b>ord1</b> edge-rtr-01 — 78%</li><li><b>lax1</b> edge-rtr-11 — 41%</li></ul>`;
  if(/changed|last hour|recent/.test(t)) return `<p>In the last hour: 6 BGP resets on edge-rtr-02 (ord1), a late storage backup saturating dfw2 Po12, and Cogent loss at LAX.</p>`;
  if(/slo|budget|risk/.test(t)) return `<p>Two SLOs are burning faster than plan: <b>dc-west availability</b> and <b>dfw2 east-west latency</b>.</p>`;
  return `<p>I can answer that best inside an investigation. ${invLink(INVESTIGATIONS[0].id)} just needs a read-only tool approval and is the fastest to unblock.</p>`;
}
function sendConv(convId, text){
  text=(text||'').trim(); if(!text) return;
  let conv=getConv(convId);
  const isNew=!conv.id;
  conv.messages.push({role:'user', text});
  if(isNew){ conv.id='cv-'+Date.now(); conv.title=text.length>42?text.slice(0,40)+'…':text; state.convs.push(conv); }
  $('msgInput').value='';
  state.stack[state.stack.length-1].convId=conv.id;
  render(); scrollBottom();
  conv.messages.push({role:'typing'}); render(); scrollBottom();
  setTimeout(()=>{
    conv.messages.pop();
    conv.messages.push({role:'assist', html: replyGeneric(text)});
    render(); scrollBottom();
  }, 700);
}

/* =======================================================================
   Events
   ======================================================================= */
document.addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  const top=state.stack[state.stack.length-1];
  // Back from Topology or Observations always lands on that
  // investigation's own summary screen — even with a chat going (split
  // or not), that's still "the investigation," not a dead end. The chat
  // itself isn't lost either way: it's state.chats[id], which is what
  // the summary screen's own split pulls from, and what the Chats tab
  // lists it under, regardless of which screen it was started from.
  if(b.dataset.back!=null){
    if((top.screen==='topology'||top.screen==='observations') && top.id){
      state.stack.pop();
      if(!state.stack[state.stack.length-1] || state.stack[state.stack.length-1].screen!=='detail'){
        state.stack.push({screen:'detail', id:top.id});
      }
      return render();
    }
    return pop();
  }
  if(b.dataset.tab) return gotoTab(b.dataset.tab);
  if(b.dataset.open) return push({screen:'detail', id:b.dataset.open});
  if(b.dataset.viewtopo) return push({screen:'topology', id:b.dataset.viewtopo});
  if(b.dataset.viewobs) return push({screen:'observations', id:b.dataset.viewobs});
  if(b.dataset.filter){ state.filter=b.dataset.filter; return render(); }
  if(b.dataset.acttab){ state.actTab=b.dataset.acttab; return render(); }
  if(b.dataset.periodtoggle!=null){ state.actPeriodOpen=!state.actPeriodOpen; return render(); }
  if(b.dataset.period){ state.actPeriod=b.dataset.period; state.actPeriodOpen=false; return render(); }
  if(b.dataset.q) return askActivityStarter(b.dataset.q);
  if(b.dataset.starter){
    const parts=b.dataset.starter.split(':');
    if(parts[0]==='topo'){
      const [,id,k]=parts, qq=topoQuestionsFor(inv(id))[+k];
      if(qq) askStarter(id, qq.q, qq.a);
    } else if(parts[0]==='obs'){
      const [,id,cardId,k]=parts, i=inv(id), c=i.cards.find(cc=>cc.id===cardId);
      const qq=c&&questionsFor(c)[+k];
      if(qq) askStarter(id, qq.q, qq.a);
    }
    return;
  }
  if(b.dataset.viewreason) return push({screen:'reasoning', id:b.dataset.viewreason});
  if(b.dataset.closechat) return closeChatSheet(b.dataset.closechat);
  if(b.dataset.newchat!=null) return startNewChat();
  if(b.dataset.conv) return push({screen:'conv', convId:b.dataset.conv});
  if(b.dataset.approve!=null) return decide(top.id, +b.dataset.approve, 'approve');
  if(b.dataset.deny!=null) return decide(top.id, +b.dataset.deny, 'deny');
  if(b.dataset.answer!=null) return answerQuestion(top.id, +b.dataset.answer);
  if(b.id==='msgSend') return handleSend();
});
function handleSend(){
  const top=state.stack[state.stack.length-1];
  const val=$('msgInput').value;
  if(top.screen==='reasoning'||top.screen==='detail'||top.screen==='topology'||top.screen==='observations') return sendReasoning(top.id, val);
  if(top.screen==='conv') return sendConv(top.convId, val);
}
$('msgInput').addEventListener('keydown', e=>{
  if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); handleSend(); }
});
$('msgInput').addEventListener('input', e=>{
  e.target.style.height='auto'; e.target.style.height=Math.min(132,e.target.scrollHeight)+'px';
});
// Closes the period menu on any click outside it — a tap on an option
// or the toggle button itself is handled above and never reaches here
// (this fires after, but by then actPeriodOpen is already what it
// should be, so the redundant close is harmless).
document.addEventListener('click', e=>{
  if(state.actPeriodOpen && !e.target.closest('.act-period-wrap')){ state.actPeriodOpen=false; render(); }
});

// ---------- Split-view grabber (drag the divider between the brief and
// the chat halves) ---------- Delegated, since .split-grabber is rebuilt
// on every render — a direct listener bound to today's element would be
// gone the moment the user sent a message or approved a step. Moves the
// pane directly via inline style while dragging (cheap) and only writes
// back to state, which triggers the next real render, once the drag ends.
let splitDrag=null;
document.addEventListener('pointerdown', e=>{
  const grabber=e.target.closest('.split-grabber');
  if(!grabber) return;
  const container=grabber.closest('.detail-split');
  const topEl=container && container.querySelector('.detail-split-top');
  if(!container||!topEl) return;
  const containerRect=container.getBoundingClientRect();
  const topRect=topEl.getBoundingClientRect();
  splitDrag={
    id:grabber.dataset.splitgrab,
    startY:e.clientY,
    startPct:(topRect.height/containerRect.height)*100,
    containerHeight:containerRect.height,
    topEl,
    samples:[{t:performance.now(), y:e.clientY}]
  };
  topEl.style.transition='none'; // follow the finger directly while dragging
  try{ grabber.setPointerCapture(e.pointerId); }catch(_){}
  e.preventDefault();
});
document.addEventListener('pointermove', e=>{
  if(!splitDrag) return;
  const now=performance.now();
  splitDrag.samples.push({t:now, y:e.clientY});
  while(splitDrag.samples.length>1 && now-splitDrag.samples[0].t>120) splitDrag.samples.shift();
  const dyPct=(e.clientY-splitDrag.startY)/splitDrag.containerHeight*100;
  // Top can shrink all the way to 0 (chat takes the whole screen), but
  // can't grow past the chat's own starting 50% — dragging down gives
  // space back only down to the size the chat first opened at, not
  // smaller. Closing it the rest of the way is what the × is for.
  const pct=Math.min(50, Math.max(0, splitDrag.startPct+dyPct));
  splitDrag.topEl.style.flex=`0 0 ${pct}%`;
  splitDrag.lastPct=pct;
});
function endSplitDrag(e){
  if(!splitDrag) return;
  const d=splitDrag; splitDrag=null;
  const chat=ensureChat(d.id);
  let pct=d.lastPct!=null?d.lastPct:d.startPct;
  // Flick detection: velocity over the last ~120ms of the gesture. A quick
  // swipe up sends the chat to the top (reference pane fully collapsed); a
  // quick swipe down brings it back to the half-and-half default.
  const first=d.samples[0], last=d.samples[d.samples.length-1];
  const dt=Math.max(1,last.t-first.t), v=(last.y-first.y)/dt; // px per ms, negative = up
  const FLICK=0.45;
  if(v<-FLICK) pct=0;
  else if(v>FLICK) pct=50;
  chat.splitPct=pct;
  const cur=splitCurrentPct(d.topEl);
  if(cur!=null) animateSplitTo(d.topEl, cur, pct);
}
document.addEventListener('pointerup', endSplitDrag);
document.addEventListener('pointercancel', endSplitDrag);

render();
</script>
